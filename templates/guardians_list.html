{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">Apoderados</h1>
  <a class="btn btn-success" href="{{ url_for('guardians_new') }}">Nuevo</a>
</div>
<div class="card"><div class="card-body p-0">
<table class="table table-hover m-0">
  <thead class="table-light"><tr>
    <th>Nombre</th><th>Email</th><th>Teléfono</th><th>Preferencia</th><th style="width:160px;"></th>
  </tr></thead>
  <tbody>
    {% for g,u in guardians %}
    <tr>
      <td>{{ u.FirstName }} {{ u.LastName }}</td>
      <td>{{ u.Email }}</td>
      <td>{{ u.Phone or '' }}</td>
      <td>{{ g.PreferredContact or '' }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-primary" href="{{ url_for('guardians_edit', gid=g.GuardianId) }}">Editar</a>
        <form action="{{ url_for('guardians_delete', gid=g.GuardianId) }}" method="post" class="d-inline"
              onsubmit="return confirm('¿Desactivar apoderado?');">
          <button class="btn btn-sm btn-outline-danger">Desactivar</button>
        </form>
      </td>
    </tr>
    {% else %}
      <tr><td colspan="5" class="text-center text-muted py-4">Sin registros</td></tr>
    {% endfor %}
  </tbody>
</table>
</div></div>
{% endblock %}
