{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">Niños</h1>
  <a class="btn btn-success" href="{{ url_for('children_new') }}">Nuevo</a>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover m-0">
      <thead class="table-light">
        <tr>
          <th>ID</th><th>Nombre</th><th>Fecha Nac.</th><th>Notas</th><th style="width:140px;"></th>
        </tr>
      </thead>
      <tbody>
      {% for c in children %}
        <tr>
          <td>{{ c.ChildId }}</td>
          <td>{{ c.FirstName }} {{ c.LastName }}</td>
          <td>{{ c.BirthDate }}</td>
          <td>{{ c.Notes or '' }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-primary" href="{{ url_for('children_edit', child_id=c.ChildId) }}">Editar</a>
            <a class="btn btn-sm btn-secondary" href="{{ url_for('child_guardians', child_id=c.ChildId) }}">Apoderados</a>

            
            <form action="{{ url_for('children_delete', child_id=c.ChildId) }}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Eliminar niño?');">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="5" class="text-center text-muted py-4">Sin registros</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
