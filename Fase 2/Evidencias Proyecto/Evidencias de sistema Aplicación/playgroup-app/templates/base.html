<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Playgroup Piececitas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('children_list') }}">Playgroup</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-3">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('children_list') }}">Niños</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('guardians_list') }}">Apoderados</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('therapists_list') }}">Terapeutas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('sessions_list') }}">Sesiones</a></li>

      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
