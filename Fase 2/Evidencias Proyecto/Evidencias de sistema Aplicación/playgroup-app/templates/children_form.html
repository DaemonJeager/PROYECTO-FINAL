{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{{ "Nuevo niño" if mode=="new" else "Editar niño" }}</h1>
<form method="post" class="card p-3">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input name="FirstName" class="form-control" required value="{{ child.FirstName if child else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Apellido</label>
      <input name="LastName" class="form-control" required value="{{ child.LastName if child else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Fecha Nacimiento</label>
      <input name="BirthDate" type="date" class="form-control" required value="{{ child.BirthDate if child else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Notas</label>
      <textarea name="Notes" class="form-control" rows="3">{{ child.Notes if child else '' }}</textarea>
    </div>
  </div>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('children_list') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
