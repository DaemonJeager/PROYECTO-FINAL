{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{{ "Nuevo apoderado" if mode=="new" else "Editar apoderado" }}</h1>
<form method="post" class="card p-3">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input name="FirstName" class="form-control" required value="{{ data.FirstName if data else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Apellido</label>
      <input name="LastName" class="form-control" required value="{{ data.LastName if data else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input name="Email" type="email" class="form-control" required value="{{ data.Email if data else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Teléfono</label>
      <input name="Phone" class="form-control" value="{{ data.Phone if data else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Preferencia de contacto</label>
      <select name="PreferredContact" class="form-select">
        {% set pc = (data.PreferredContact if data else 'email') %}
        <option value="email"    {{ 'selected' if pc=='email'    else '' }}>Email</option>
        <option value="phone"    {{ 'selected' if pc=='phone'    else '' }}>Teléfono</option>
        <option value="whatsapp" {{ 'selected' if pc=='whatsapp' else '' }}>WhatsApp</option>
      </select>
    </div>
  </div>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('guardians_list') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
